name: Normalize runner selectors once
on:
  push:
    branches: [agent/exact-runner-selectors]
    paths: [.github/workflows/normalize-runner-selectors.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalize:
    runs-on: [self-hosted, fast]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/exact-runner-selectors, fetch-depth: 0}
      - name: Normalize and install exact policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          root=Path('.'); wf=root/'.github/workflows'; once=wf/'normalize-runner-selectors.yml'
          job=re.compile(r'^  [A-Za-z0-9_.-]+:\s*(?:#.*)?$'); runs=re.compile(r'^(?P<i>\s*)runs-on:\s*(?P<v>.*)$')
          def pick(block,value):
            low=(block+'\n'+value).lower()
            if any(x in low for x in ('macos','xcodebuild','sw_vers','osascript','codesign','plutil','darwin')): return '[self-hosted, macOS, ARM64]'
            if any(x in low for x in ('container:','services:','docker','docker compose','docker-compose','podman')): return '[self-hosted, docker]'
            if 'backtest' in low: return '[self-hosted, backtester]'
            return '[self-hosted, fast]'
          for p in sorted(wf.glob('*.y*ml')):
            if p==once: continue
            a=p.read_text(encoding='utf-8').splitlines(); o=[]; n=0
            while n<len(a):
              if not job.match(a[n]): o.append(a[n]); n+=1; continue
              e=n+1
              while e<len(a) and not job.match(a[e]):
                if a[e] and not a[e].startswith((' ','#')): break
                e+=1
              b=a[n:e]; bt='\n'.join(b); j=0
              while j<len(b):
                m=runs.match(b[j])
                if not m: o.append(b[j]); j+=1; continue
                v=m.group('v').strip(); k=j+1
                if not v:
                  z=[]
                  while k<len(b):
                    q=b[k]; ind=len(q)-len(q.lstrip())
                    if q.strip() and ind<=len(m.group('i')): break
                    if q.strip().startswith('-'): z.append(q.strip())
                    k+=1
                  v=' '.join(z)
                o.append(f"{m.group('i')}runs-on: {pick(bt,v)}"); j=k
              n=e
            p.write_text('\n'.join(o)+'\n',encoding='utf-8')
          s=root/'.github/scripts/check_runner_selectors.py'; s.parent.mkdir(parents=True,exist_ok=True)
          s.write_text('''#!/usr/bin/env python3
import re,sys
from pathlib import Path
A={"[self-hosted, fast]","[self-hosted, docker]","[self-hosted, backtester]","[self-hosted, macOS, ARM64]"};R=re.compile(r"^\\s+runs-on:\\s*(.*?)\\s*(?:#.*)?$");E=[]
for p in sorted(Path(".github/workflows").glob("*.y*ml")):
 for n,l in enumerate(p.read_text(encoding="utf-8").splitlines(),1):
  m=R.match(l)
  if m and m.group(1) not in A:E.append(f"{p}:{n}: {m.group(1)!r}")
if E:print("Forbidden runs-on selectors:\\n"+"\\n".join(E),file=sys.stderr);raise SystemExit(1)
print("Runner selector policy passed.")
''',encoding='utf-8')
          (wf/'self-hosted-runner-policy.yml').write_text('''name: Self-hosted runner selector policy
on:
  pull_request:
    paths: ['.github/workflows/**', '.github/scripts/check_runner_selectors.py', '.github/RUNNER_LABELS.md']
  push:
    paths: ['.github/workflows/**', '.github/scripts/check_runner_selectors.py', '.github/RUNNER_LABELS.md']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  enforce:
    runs-on: [self-hosted, fast]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 .github/scripts/check_runner_selectors.py
''',encoding='utf-8')
          (root/'.github/RUNNER_LABELS.md').write_text('''# Canonical runner selectors

```yaml
runs-on: [self-hosted, fast]
runs-on: [self-hosted, docker]
runs-on: [self-hosted, backtester]
runs-on: [self-hosted, macOS, ARM64]
```

Only these four exact selectors are allowed.
''',encoding='utf-8'); once.unlink()
          PY
      - run: python3 .github/scripts/check_runner_selectors.py
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A && git diff --cached --check
          git commit -m 'ci: enforce four exact self-hosted runner selectors'
          git push origin HEAD:agent/exact-runner-selectors
