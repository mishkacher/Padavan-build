name: Dependency runner policy

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/audit_docker_runner_routing.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize-runner-selectors:
    if: github.head_ref == 'agent/exact-runner-selectors'
    runs-on: [self-hosted, fast]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply exact selector migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/normalize-runner-selectors.yml').read_text(encoding='utf-8')
          script = source.split("python3 - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          exec(compile(textwrap.dedent(script), 'runner-normalizer', 'exec'))
          legacy = Path('.github/workflows/docker-runner-policy.yml')
          if legacy.exists():
              legacy.unlink()
          PY
          python3 .github/scripts/check_runner_selectors.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'ci: enforce four exact self-hosted runner selectors'
          git push origin HEAD:${{ github.head_ref }}
